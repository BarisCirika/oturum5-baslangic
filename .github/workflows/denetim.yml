# Otomatik denetim hatti — MOCK mod (SIFIR API maliyeti).
# Gercek model cagrisi YOK: otomasyon/denetim_mock.py deterministik
# kurallarla tarar. Bu yuzden hicbir secret'a ihtiyac duyulmaz.
name: denetim

# UC TETIKLEYICI, UC AYRI IS:
#   pull_request -> KAPI        : kod main'e GIRMEDEN once denetlenir,
#                                 sonuc PR yorumu olarak yazilir
#   push (main)  -> GUVENLIK AGI: PR acmadan dogrudan main'e push edilirse
#                                 de denetlenir, BULGU VARSA issue acilir
#   schedule     -> GECE TARAMASI: her gece tum depoyu tarar, sonucu
#                                 ISSUE olarak acar (cron'da PR yoktur)
#   workflow_dispatch -> ELLE   : Actions sekmesinden test kosusu;
#                                 gece taramasiyla ayni yolu izler
on:
  pull_request:
    types: [opened, synchronize]   # PR acilinca ve her yeni push'ta
  push:
    branches: [main]
  schedule:
    # UTC! Yerel saat DEGIL. Turkiye UTC+3 ve yaz saati uygulamiyor,
    # bu yuzden yerel 03:00 = 00:00 UTC. Gece taramasi tum depoyu
    # tarar ve sonucu ISSUE olarak acar (cron'da PR yoktur).
    - cron: "0 0 * * *"
  workflow_dispatch:

# Ayni dal icin tek kosu: yeni push gelince eskisi iptal olsun
# (bosa gecen dakika harcanmasin, sonuclar karismasin)
concurrency:
  group: denetim-${{ github.ref }}
  cancel-in-progress: true

# En az ayricalik ilkesi. Burada ILAN etmezsek varsayilan salt-okunur
# token yaziyla ilgili API cagrilarinda 403 doner.
permissions:
  contents: read          # depoyu checkout etmek icin
  pull-requests: write    # PR'a yorum yazmak icin
  issues: write           # ISSUE acmak icin (yorum degil, olusturma hakki)

jobs:
  denetim:
    runs-on: ubuntu-latest    # Linux: ucretsiz dakika carpani 1x
    timeout-minutes: 10       # asili kalirsa BASARISIZ olsun (bosa dakika yakma)

    steps:
      # 1) Depoyu al -----------------------------------------------------
      - name: Depoyu al
        uses: actions/checkout@v4
        with:
          fetch-depth: 0      # diff icin gecmis gerekir (sig klon yetmez)
          # Token'i git config'e YAZMA: sonraki adimlar onu
          # kullanamasin (okuma yetkisi yeterli).
          persist-credentials: false

      # 2) Kapsami belirle (olaya gore) ----------------------------------
      - name: Kapsami belirle
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # PR: yalniz DEGISEN dosyalar — ucuz ve odakli
            git diff --name-only origin/${{ github.base_ref }}...HEAD > kapsam.txt
          elif [ "${{ github.event_name }}" = "push" ]; then
            # push: son commit'te degisenler (ilk commit ise tum dosyalar)
            git diff --name-only HEAD~1 HEAD > kapsam.txt 2>/dev/null \
              || git ls-files > kapsam.txt
          else
            # elle tetikleme: tum dosyalar
            git ls-files > kapsam.txt
          fi
          echo "--- kapsam ---"; cat kapsam.txt
          echo "dosya sayisi: $(wc -l < kapsam.txt)"

      # 3) Denetimi kostur (MOCK) ----------------------------------------
      #    Betik yuksek etkili bulgu bulursa exit 1 doner. continue-on-error
      #    ile kosuyu BURADA kesmiyoruz ki rapor yine de yazilabilsin;
      #    kirmizi yakma isini en sondaki adim yapar (adim 6).
      - name: Denetimi kostur (MOCK)
        id: mock
        continue-on-error: true
        run: python3 otomasyon/denetim_mock.py kapsam.txt rapor.md sonuc.json

      # 3b) COK AJANLI MODEL DENETIMI (DANISMAN gorevi) ------------------
      #     Uc ajan, uc ayri rol, uc ayri session id:
      #       guvenlik / kalite / tutarlilik
      #     Deterministik kural KAPI'dir, ajanlar DANISMAN'dir.
      #
      #     VARSAYILAN MOCK: model cagrilmaz, maliyet 0. Gercek mod icin
      #     hem vars.DENETIM_MOD=GERCEK hem ANTHROPIC_API_KEY gerekir.
      #
      #     FRENLER (otomasyon/ajanlari-kostur.sh icinde):
      #       - ajan basi --max-budget-usd ve timeout
      #       - ajan basi --max-turns, --permission-mode plan (yazma yok)
      #       - kosu basina TOPLAM butce; asilirsa cikis kodu 3 -> KIRMIZI
      - name: Claude Code kur (yalniz GERCEK mod)
        if: vars.DENETIM_MOD == 'GERCEK'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Claude Code yukle (yalniz GERCEK mod)
        if: vars.DENETIM_MOD == 'GERCEK'
        timeout-minutes: 3
        run: npm install -g @anthropic-ai/claude-code

      - name: Model ajanlari
        id: ajanlar
        continue-on-error: true       # rapor yazilsin; kirmiziyi son adim yakar
        timeout-minutes: 8
        env:
          DENETIM_MOD: ${{ vars.DENETIM_MOD || 'MOCK' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AJAN_BUTCE: ${{ vars.AJAN_BUTCE || '0.50' }}
          AJAN_SURE: ${{ vars.AJAN_SURE || '300' }}
          TOPLAM_BUTCE: ${{ vars.TOPLAM_BUTCE || '1.50' }}
          AJAN_TUR: ${{ vars.AJAN_TUR || '12' }}
        run: |
          bash otomasyon/ajanlari-kostur.sh kapsam.txt rapor.md maliyet.json
          {
            echo "### Model ajanlari (${DENETIM_MOD})"
            echo ""
            echo '```json'
            cat maliyet.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 4) Dogrulama kapisi ----------------------------------------------
      #    "Adim yesil yandi" yetmez; CIKTININ ICINE bakariz. Rapor bossa
      #    denetim gercekte kosmamistir -> kosuyu burada BASARISIZ yap.
      - name: Sonucu dogrula
        id: dogrula
        run: |
          set -euo pipefail
          test -s rapor.md || { echo "HATA: rapor bos - denetim gercekte kosmadi" >&2; exit 1; }
          test -s sonuc.json || { echo "HATA: sonuc.json bos" >&2; exit 1; }
          python3 - <<'PY'
          import json, os
          d = json.load(open("sonuc.json", encoding="utf-8"))
          print("ozet:", d)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"yuksek={int(d.get('yuksek', 0) or 0)}\n")
              f.write(f"durum={d.get('durum', 'bilinmiyor')}\n")
          PY

      # 5a) PR olayinda: sonucu PR YORUMU olarak yaz ----------------------
      - name: PR'a yorum yaz
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: fs.readFileSync('rapor.md', 'utf8')
            });

      # 5b) cron / push / elle: PR yok, yorum yazilacak yer yok -> ISSUE ac
      #     schedule ve elle kosuda RAPOR HER ZAMAN issue olur (gece
      #     taramasinin ciktisi bir yere dusmeli). push'ta ise gurultuyu
      #     azaltmak icin yalniz YUKSEK bulgu varsa issue aciliyor.
      - name: Issue ac
        if: >-
          github.event_name == 'schedule'
          || github.event_name == 'workflow_dispatch'
          || (github.event_name == 'push' && steps.dogrula.outputs.yuksek != '0')
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Denetim (${context.eventName}) - ${new Date().toISOString().slice(0, 10)}`,
              body: fs.readFileSync('rapor.md', 'utf8')
                  + `\n\n---\nKosu: ${context.serverUrl}/${context.repo.owner}/`
                  + `${context.repo.repo}/actions/runs/${context.runId}`
            });

      # 6) KAPI: yuksek etkili bulgu varsa kosu KIRMIZI yansin ------------
      #    Rapor YAZILDIKTAN SONRA calisir; once bilgi verilir, sonra bloklanir.
      - name: Yuksek etkili bulgu varsa basarisiz ol
        if: steps.dogrula.outputs.yuksek != '0'
        run: |
          echo "Yuksek etkili ${{ steps.dogrula.outputs.yuksek }} bulgu var." >&2
          exit 1

      # Ajan adimi butce asiminda cikis kodu 3 doner (continue-on-error ile
      # yutuldu). Rapor yazildiktan SONRA burada kirmizi yakiyoruz.
      - name: Ajan butcesi asildiysa basarisiz ol
        if: steps.ajanlar.outcome == 'failure'
        run: |
          echo "Model ajanlari adimi basarisiz (butce asimi ya da hata)." >&2
          cat maliyet.json 2>/dev/null || true
          exit 1

      # 7) Basarisizlikta log'a not dus -----------------------------------
      - name: Basarisizlik notu
        if: failure()
        run: |
          {
            echo "### Denetim BASARISIZ"
            echo "- olay: ${{ github.event_name }} / dal: ${{ github.ref_name }}"
            echo "- denetim adimi cikis kodu: ${{ steps.mock.outcome }}"
            echo "- yuksek etkili bulgu: ${{ steps.dogrula.outputs.yuksek || 'okunamadi' }}"
            echo "- Bulgu yoksa: betik hic kosmadi ya da rapor bos uretildi."
            echo ""
            echo "Uretilen rapor (varsa):"
            echo ""
            if [ -s rapor.md ]; then cat rapor.md; else echo "_rapor.md bos ya da yok_"; fi
          } >> "$GITHUB_STEP_SUMMARY"

# NOT: Kirmizi check tek basina merge'i ENGELLEMEZ. Gercek engelleme icin
# depo ayarlarindan branch protection acilip bu denetim "required status
# check" yapilmalidir. O ayar olmadan CI "cok hizli uyaran bir cron"dur.

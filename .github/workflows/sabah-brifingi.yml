# Sabah brifingi — her sabah deponun son 24 saatini tek issue'da toplar.
#
# Veri kaynagi: GitHub'in KENDI API'si (actions/github-script icindeki
# github istemcisi). Ek servis, hesap ya da secret YOK; kosuya otomatik
# verilen GITHUB_TOKEN yetiyor.
name: sabah-brifingi

on:
  schedule:
    # UTC! Yerel saat DEGIL. Turkiye UTC+3 ve yaz saati uygulamiyor:
    # yerel 07:00 = 04:00 UTC.
    - cron: "0 4 * * *"
  workflow_dispatch:      # elle test

concurrency:
  group: brifing-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write           # brifing issue'sunu acmak icin
  pull-requests: read     # PR listesini okumak icin
  actions: read           # kosu gecmisini okumak icin

jobs:
  brifing:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Brifingi uret ve issue ac
        timeout-minutes: 5    # API yavaslarsa is butcesini yemesin
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const SAAT = 24;
            const sinir = new Date(Date.now() - SAAT * 60 * 60 * 1000);
            const gun = (d) => new Date(d).toISOString().slice(0, 16).replace("T", " ");
            const yas = (d) => {
              const s = Math.floor((Date.now() - new Date(d)) / 3600000);
              return s < 24 ? `${s} saat` : `${Math.floor(s / 24)} gun`;
            };

            // --- 1) Son 24 saatte merge edilen PR'lar --------------------
            // Kapali PR'lari tarihe gore alip merged_at'e bakiyoruz:
            // kapali != merge edilmis (kapatilip birakilanlar da var).
            const kapali = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: "closed", sort: "updated",
              direction: "desc", per_page: 100
            }, (r, done) => {
              if (r.data.every(p => new Date(p.updated_at) < sinir)) done();
              return r.data;
            });
            const mergeli = kapali.filter(
              p => p.merged_at && new Date(p.merged_at) >= sinir);

            // --- 2) Su an acik PR'lar -----------------------------------
            const acik = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: "open", sort: "created",
              direction: "asc", per_page: 100
            });

            // --- 3) Son 24 saatte kirmizi yanan kosular ------------------
            // created filtresi API tarafinda uygulanir: bosa veri cekmeyiz.
            const tarih = sinir.toISOString().slice(0, 10);
            const kirmizi = [];
            for (const durum of ["failure", "timed_out", "cancelled"]) {
              const r = await github.rest.actions.listWorkflowRunsForRepo({
                owner, repo, status: durum, created: `>=${tarih}`,
                per_page: 100
              });
              kirmizi.push(...r.data.workflow_runs.filter(
                k => new Date(k.created_at) >= sinir));
            }
            kirmizi.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            // --- 4) Maliyet: model ajanlari + CI dakikalari --------------
            // Model maliyeti, denetim raporunun sonuna dusen makine-okur
            // satirlardan toplanir:
            //   <!-- maliyet ajan=X mod=Y usd=Z oturum=... kosu=... -->
            // Boylece ayri bir veritabani ya da depoya commit gerekmez;
            // kaynak, zaten acik olan PR yorumu / issue govdesidir.
            const since = sinir.toISOString();
            const govdeler = [];
            const yorumlar = await github.paginate(
              github.rest.issues.listCommentsForRepo,
              { owner, repo, since, per_page: 100 });
            govdeler.push(...yorumlar.map(y => y.body || ""));
            const issuelar = await github.paginate(github.rest.issues.listForRepo,
              { owner, repo, state: "all", since, per_page: 100 });
            govdeler.push(...issuelar.map(i => i.body || ""));

            const desen = /<!--\s*maliyet\s+ajan=(\S+)\s+mod=(\S+)\s+usd=([0-9.]+)\s+oturum=(\S+)\s+kosu=(\S+)\s*-->/g;
            const ajanToplam = {}; const oturumlar = new Set();
            let modelUsd = 0, kayitSayisi = 0, mockSayisi = 0;
            for (const g of govdeler) {
              for (const m of g.matchAll(desen)) {
                const [, ajan, mod, usd, oturum] = m;
                const d = parseFloat(usd) || 0;
                modelUsd += d; kayitSayisi++;
                if (mod !== "GERCEK") mockSayisi++;
                ajanToplam[ajan] = (ajanToplam[ajan] || 0) + d;
                if (oturum && oturum !== "-") oturumlar.add(oturum);
              }
            }

            // CI dakikalari: son 24 saatteki TUM kosularin suresi.
            // paginate bu uc nokta icin diziyi kendisi cikarir; mapFn
            // verirsek r.data zaten dizi olur ve .workflow_runs undefined
            // doner (ilk denemede kosu bu yuzden kirmizi yandi).
            const tumKosular = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              { owner, repo, created: `>=${tarih}`, per_page: 100 });
            const sonKosular = tumKosular.filter(
              k => k && k.created_at && new Date(k.created_at) >= sinir);
            let saniye = 0;
            for (const k of sonKosular) {
              const bas = new Date(k.run_started_at || k.created_at);
              const bit = new Date(k.updated_at);
              if (bit > bas) saniye += (bit - bas) / 1000;
            }
            const dakika = Math.round(saniye / 6) / 10;

            // --- Raporu kur ---------------------------------------------
            const L = [];
            L.push(`Son ${SAAT} saat: ${gun(sinir)} - ${gun(new Date())} (UTC)`, "");

            L.push(`## Merge edilen PR'lar (${mergeli.length})`, "");
            if (!mergeli.length) {
              L.push("_Yok._");
            } else {
              for (const p of mergeli) {
                L.push(`- #${p.number} ${p.title} — ${p.user.login}, ${gun(p.merged_at)}`);
              }
            }
            L.push("");

            L.push(`## Acik PR'lar (${acik.length})`, "");
            if (!acik.length) {
              L.push("_Yok._");
            } else {
              for (const p of acik) {
                const etiket = [
                  p.draft ? "taslak" : null,
                  `${yas(p.created_at)} once acildi`,
                  `son hareket ${yas(p.updated_at)} once`
                ].filter(Boolean).join(", ");
                L.push(`- #${p.number} ${p.title} — ${p.user.login} (${etiket})`);
              }
            }
            L.push("");

            L.push(`## Kirmizi yanan kosular (${kirmizi.length})`, "");
            if (!kirmizi.length) {
              L.push("_Yok — tum kosular yesil._");
            } else {
              for (const k of kirmizi) {
                L.push(`- **${k.name}** (${k.conclusion}) — ${k.event}, `
                     + `${k.head_branch}, ${gun(k.created_at)} — [kosu](${k.html_url})`);
              }
            }
            L.push(`## Maliyet`, "");
            L.push("| Kalem | Deger |", "|---|---|");
            L.push(`| Model maliyeti (son 24s) | **${modelUsd.toFixed(4)} USD** |`);
            L.push(`| Ajan kaydi | ${kayitSayisi} (${mockSayisi} tanesi MOCK) |`);
            L.push(`| Ayri oturum (session id) | ${oturumlar.size} |`);
            L.push(`| CI kosusu | ${sonKosular.length} |`);
            L.push(`| CI suresi | ${dakika} dakika (public repo: ucretsiz) |`);
            L.push("");
            const ajanAdlari = Object.keys(ajanToplam).sort();
            if (ajanAdlari.length) {
              L.push("Ajan kirilimi:", "");
              for (const a of ajanAdlari) {
                L.push(`- ${a}: ${ajanToplam[a].toFixed(4)} USD`);
              }
              L.push("");
            } else {
              L.push("_Son 24 saatte ajan kaydi yok._", "");
            }
            if (modelUsd === 0) {
              L.push("_Model maliyeti 0: denetim MOCK modda kosuyor, "
                   + "model cagrilmiyor._", "");
            }

            L.push("", "---",
                   `_Bu brifing ${context.eventName} olayiyla uretildi. `
                 + `[Kosu](${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId})_`);

            const govde = L.join("\n");

            // Kosu ozetine de yaz: issue acilmasa bile sonuc gorunur olsun
            await core.summary.addRaw(govde).write();

            // Brifing HER SABAH acilir (bulguya bagli degil): "dun ne oldu"
            // sorusunun cevabi, kotu haber olmasa da bir yere dusmeli.
            const issue = await github.rest.issues.create({
              owner, repo,
              title: `Sabah brifingi - ${new Date().toISOString().slice(0, 10)}`,
              body: govde,
              labels: ["brifing"]
            });
            core.info(`issue acildi: ${issue.data.html_url}`);
